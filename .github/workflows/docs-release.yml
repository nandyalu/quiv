name: Docs-Release Notes
on:
  release:
    # `published` and `released` BOTH fire for an ordinary release, which
    # started two identical runs racing each other to deploy. `published`
    # alone covers every release this project makes, prereleases included.
    types: [published, edited]
  workflow_dispatch:
# Both docs workflows share this group so that two builds never deploy to
# Pages at the same time. Simultaneous deploys are what served a stale
# artifact after v1.0.0.
#
# This is NOT a FIFO queue. GitHub keeps one running and one pending run per
# group, and a newly queued run cancels the pending one; cancel-in-progress
# only protects the run that is already executing. Correctness therefore does
# not rest on ordering. It rests on changelog-from-release reading the
# Releases API at execution time, so any build that runs after a release is
# published contains it, whichever workflow started it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - name: Wait for release API availability
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          for i in $(seq 1 30); do
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "Release $TAG is available in API"
              exit 0
            fi
            echo "Waiting for release to propagate... ($i/30)"
            sleep 2
          done
          echo "::warning::Release $TAG not found in API after 60s, proceeding anyway"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Changelog from Releases
        uses: rhysd/changelog-from-release/action@v3
        with:
          file: docs/release-notes.md
          push: false
          args: -l 2
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the release reached the generated notes
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if ! grep -qF "$TAG" docs/release-notes.md; then
            echo "::error::$TAG is missing from the generated release notes."
            echo "The Releases API had not caught up. Re-run this workflow."
            exit 1
          fi
          echo "$TAG is present in the generated notes"

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: python scripts/generate_llms_full.py
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
