name: Tests

on:
  push:
    paths:
      - "quiv/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "quiv/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  test:
    # Three platforms since 2026-09-25 (Phase 7 §0, pulled forward ahead of
    # Phase 8). fail-fast is off so one platform's failure still shows the
    # result on the other two, which is what makes a failure attributable.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests with coverage
        # The coverage floor lives in pyproject.toml ([tool.coverage.report]
        # fail_under). pytest exits non-zero when coverage drops below it, so
        # this step fails the build on a coverage regression as well as on a
        # test failure. Keep the threshold in pyproject only — a second copy
        # here would drift.
        run: uv run pytest tests/ -v --cov=quiv --cov-report=term --cov-report=xml

      - name: Upload coverage report
        # GITHUB_TOKEN is read-only for fork PRs, so the coverage comment can only be posted for same-repo PRs.
        # One comment per PR: only the Ubuntu / 3.13 cell posts it.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: orgoro/coverage@v3.3
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
